<!DOCTYPE html>
<html>
    <head>
        <title>Login Card</title>
        <style>
            .container{
                width: 300px;
                margin: 100px auto;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                text-align: center;
                
            }

        </style>
    </head>
    <body>
        <div class="container">
            <h2>Login</h2>
            <form>
                <input type="text" placeholder="Username" />
                <input type="password" placeholder="Password" />
                <button type="submit">Login</button>
            </form>
        </div>
    </body>
</html>
