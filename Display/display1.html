<!DOCTYPE html>
<html>
    <head>
        <title>Display Tutorial</title>
        <style>
            .box{
                width:300px;
                display:inline-block;
                height:150px;
                background-color:aqua;
                border:2px solid black;
            }
            .hidden{
                visibility:hidden;
            }

        </style>
    </head>
    <body>
<div class="box">Box 1</div>
<div class="box hidden">Box 2</div>
<div class="box">Box 3</div>

    </body>
</html>
