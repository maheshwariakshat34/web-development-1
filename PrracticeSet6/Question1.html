<!DOCTYPE html>
<html>
    <head>
        <title>My Web Page</title>
        <style>
            .navbar{
                display:flex;
                background-color:pink;
                justify-content:space-evenly;
            }
            a{
                text-decoration:none;
                color:red;
            }
            li{
                list-style-type:none;
               
            }
            .outer{
                height:400px;
                width:400px;
                background-color:aqua;
                display:flex;
                justify-content:center;
                align-items:center;

            }
            .inner{
                height:100px;
                width:100px;
                background-color:blueviolet;
               
            }

        </style>
    </head>
    <body>
        <ul class="navbar">
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li> 
            <li><a href="#">Help</a></li>
            </ul>
            <div class="outer">
                <div class="inner"></div>
            </div>
    </body>

</html>
