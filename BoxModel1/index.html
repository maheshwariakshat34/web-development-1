<!DOCTYPE html>
<html>
    <head>
        <title>Box Model</title>
        <style>
            *{
                padding:0;
                margin:0;
                box-sizing:border-box;
                
            }
            .Box1{
                width:200px;
                height:100px;
                background-color:red;
                border:2px solid black;
                margin:10px;
                line-height:96px;
                text-align:center;

            }
            .Box2{
                width:250px;
                height:120px;
                background-color:purple;
                border:2px solid black;
                text-align:center;
                margin:10px 0px 0px 10px;
            }
            .Box3{
                width:300px;
                height:150px;
                background-color:blue;
                border:2px solid black;
                text-align:center;
                margin:10px 0px 0px 10px;
            }
        </style>
        </head>
<body>
    
    <div class="Box1">Box1</div>
    <div class="Box2">Box2</div>
    <div class="Box3">Box3</div>
  
</body>
</html>
