<!DOCTYPE html>
<html>
<head>
    <title>Advanced Box Model</title>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing:border-box;
        }
        .card{
            width:350px;
            height:220px;
            border:3px solid black;
            padding:20px;
            border-radius:5px;
            margin:30px auto;
            background-color:aqua;
            

        }
        .content{
            width:100%;
            height:100%;
            padding:20px;
            border:3px solid black;
            text-align:center;
            background-color:white;
        }
        .content h2{
            margin-bottom:15px;
        }
        .content p{
            margin-bottom:20px;

        }
        .content button{
            padding:10px;
            border-radius:5px;
            border:1px solid black;
            margin-top:30px;
            background-color:green;
        }

    </style>
    </head>
    <body>
        <div class="card">
            <div class="content">
                <h2>Project</h2>
                <p>My Portfolio App</p>
                <button >View Project</button>
            </div>
        </div>

    </body>


</html>
