<!DOCTYPE html>
<html>
    <head>
        <title>Card Layout</title>
        <style>
            *{
                box-sizing:border-box;
            }
             .card1,.card2,.card3{
                display:inline-block;
                width:250px;
                height:180px;
                padding:20px;
                border:3px solid black;
                border-radius:10px;
                margin:40px;
                
             }
             .container{
                text-align:center;
             }
             .card1{
                
             }
             h2{
                background-color:blue;
                
             }
             

        </style>
       
    </head>
    <body>
        
        <div class="container">
            <div class="card1">
                <h2>Project</h2>
                <p>My Project</p>
            </div>
            <div class="card2">
                <h2>Skills</h2>
                <p>HTML CSS JAVASCRIPT</p>
            </div>
            <div class="card3">
                <h2>Contact</h2>
                <p>Email me.</p>
             </div>
             </div>

     
        
    </body>
</html>
