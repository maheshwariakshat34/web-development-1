<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>
    <style>
        .container{
            display:grid;
            height:500px;
            width:500px;
            grid-template-rows:repeat(3,1fr);
            grid-template-columns:repeat(3,1fr);
            gap:15px;


        }
        .container>div{
            box-shadow:0px 0px 5px black;
        }
        #box1{
            grid-column-start:1;
            grid-column-end:3;
            grid-row-start:1;
            grid-row-end:3;
        } 
        #box5{
            grid-column-start:2;
            grid-column-end:4;
            
        }

     </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        
        
           
    </div>
</body>
</html>
