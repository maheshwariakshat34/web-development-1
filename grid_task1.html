<!DOCTYPE html>
<html>
    <head>
        <title>Basic Photo Gallery</title>
        <style>
            .container{
                display:grid;
                grid-template-columns:repeat(4,200px);
                grid-template-rows:repeat(3, 200px);
                column-gap:10px;
                row-gap:10px;
            }
            .container div{
                border:2px solid red;
                background-color:lightblue;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item1"></div>
            <div class="item2"></div>
            <div class="item3"></div>
            <div class="item4"></div>
            <div class="item5"></div>
            <div class="item6"></div>
            <div class="item7"></div>
            <div class="item8"></div>
            <div class="item9"></div>
            <div class="item10"></div>
            <div class="item11"></div>
            <div class="item12"></div>
        </div>
    </body>
</html>
