<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox</title>
        <style>
            .container{
                width: 100%;
                
                display:flex;
                
                flex-direction:row;
                justify-content:center;
                align-items:center;
            }
            .item1{
                width:50px;
                height:50px;
                background-color:red;
            }
            .item2{
                width:50px;
                height:50px;
                background-color:green;
            }
            .item3{
                width:50px;
                height:50px;
                background-color:blue;
            }
            .item4{
                width:50px;
                height:50px;
                background-color:yellow;
            }
            .item5{
                width:50px;
                height:50px;
                background-color:orange;
            }


            

        </style>
    </head>
    <div class="container">
        <div class="item1">Item 1</div>
        <div class="item2">Item 2</div>
        <div class="item3">Item 3</div>
        <div class="item4">Item 4</div>
        <div class="item5">Item 5</div>
    </div>
</html>
