<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <style>
          section h2{
            color:blue;
          }
          section > h2{
            color:green;
          }
          h2 ~p{
            color:purple;
          }
          h2 +p{
            color:blueviolet;
          }
          button:active{
            background-color:yellow;
          }
          button:hover{
            background-color:black;
            color:white;
          }
          a:visited{
            color:red;
          }
          
        </style>

</head>
<body>
    
    <section>
        <h2>Heading 1</h2>
        <p>Para 1</p>
        <p>Para 2</p>
        <div>
            <h2>Heading 2</h2>
        </div> 
    </section>
    <button>ClickMe!!</button>
    <a>Link</a>
</body>

</html>
